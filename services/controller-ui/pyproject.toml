[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-ui"
version = "0.1.0"
description = "Web UI and shader engine for driving the flip-dot display"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pyserial>=3.5",
    "pillow>=10.0",
]

[project.scripts]
controller-ui = "controller_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
